[workspace]
resolver = "3"
members = ["material-iced", "gallery"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["AnmiTaliDev <anmitalidev@nuros.org>"]
license = "LGPL-3.0-only"

[workspace.dependencies]
iced = { version = "0.14.0", default-features = false }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 2
